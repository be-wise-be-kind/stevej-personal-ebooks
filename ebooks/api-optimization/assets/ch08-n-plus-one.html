<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N+1 Query Pattern</title>
    <style>
        body {
            font-family: Liberation Sans, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .diagram-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            max-width: 100%;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

            <!-- Title -->
            <text x="450" y="35" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">N+1 Query Growth vs. Batch Loading</text>

            <!-- Chart background -->
            <rect x="100" y="80" width="720" height="340" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

            <!-- Horizontal grid lines and Y-axis tick labels -->
            <!-- y=420 → 0 queries -->
            <!-- y=335 → 2500 queries -->
            <!-- y=250 → 5000 queries -->
            <!-- y=165 → 7500 queries -->
            <!-- y=80  → 10000 queries (approx top) -->

            <!-- Grid line: 2500 -->
            <line x1="100" y1="335" x2="820" y2="335" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
            <!-- Grid line: 5000 -->
            <line x1="100" y1="250" x2="820" y2="250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
            <!-- Grid line: 7500 -->
            <line x1="100" y1="165" x2="820" y2="165" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
            <!-- Grid line: 10000 (top edge) -->
            <line x1="100" y1="80" x2="820" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

            <!-- Y-axis tick labels -->
            <text x="90" y="424" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">0</text>
            <text x="90" y="339" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">2,500</text>
            <text x="90" y="254" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">5,000</text>
            <text x="90" y="169" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">7,500</text>
            <text x="90" y="84" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">10,000</text>

            <!-- Y-axis tick marks -->
            <line x1="97" y1="420" x2="100" y2="420" stroke="#64748b" stroke-width="1"/>
            <line x1="97" y1="335" x2="100" y2="335" stroke="#64748b" stroke-width="1"/>
            <line x1="97" y1="250" x2="100" y2="250" stroke="#64748b" stroke-width="1"/>
            <line x1="97" y1="165" x2="100" y2="165" stroke="#64748b" stroke-width="1"/>
            <line x1="97" y1="80" x2="100" y2="80" stroke="#64748b" stroke-width="1"/>

            <!-- Y-axis label (rotated) -->
            <text x="30" y="250" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#64748b" transform="rotate(-90, 30, 250)">Database Queries Issued</text>

            <!-- X-axis baseline -->
            <line x1="100" y1="420" x2="820" y2="420" stroke="#64748b" stroke-width="1"/>

            <!-- X-axis tick marks and labels -->
            <!-- x=100: 10 records -->
            <line x1="100" y1="420" x2="100" y2="423" stroke="#64748b" stroke-width="1"/>
            <text x="100" y="436" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">10</text>

            <!-- x=310: 100 records -->
            <line x1="310" y1="420" x2="310" y2="423" stroke="#64748b" stroke-width="1"/>
            <text x="310" y="436" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">100</text>

            <!-- x=530: 1,000 records -->
            <line x1="530" y1="420" x2="530" y2="423" stroke="#64748b" stroke-width="1"/>
            <text x="530" y="436" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">1,000</text>

            <!-- x=820: 10,000 records -->
            <line x1="820" y1="420" x2="820" y2="423" stroke="#64748b" stroke-width="1"/>
            <text x="820" y="436" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#64748b">10,000</text>

            <!-- X-axis label -->
            <text x="460" y="455" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#64748b">Records Fetched</text>

            <!-- Shaded area between N+1 line (top) and batch line (bottom) -->
            <!-- N+1 points: (100,419), (310,416), (530,380), (820,80) -->
            <!-- Batch points: (100,419), (310,419), (530,419), (820,419) -->
            <!-- Polygon goes: N+1 forward then batch backward -->
            <polygon points="100,419 310,416 530,380 820,80 820,419 530,419 310,419 100,419" fill="#fee2e2" fill-opacity="0.3"/>

            <!-- Green batch line (flat at y=419) -->
            <polyline points="100,419 310,419 530,419 820,419" fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/>

            <!-- Red N+1 line -->
            <polyline points="100,419 310,416 530,380 820,80" fill="none" stroke="#ef4444" stroke-width="3" stroke-linejoin="round"/>

            <!-- N+1 data point circles -->
            <circle cx="100" cy="419" r="6" fill="#ef4444" stroke="white" stroke-width="2"/>
            <circle cx="310" cy="416" r="6" fill="#ef4444" stroke="white" stroke-width="2"/>
            <circle cx="530" cy="380" r="6" fill="#ef4444" stroke="white" stroke-width="2"/>
            <circle cx="820" cy="80" r="6" fill="#ef4444" stroke="white" stroke-width="2"/>

            <!-- Batch data point circles -->
            <circle cx="100" cy="419" r="6" fill="#22c55e" stroke="white" stroke-width="2"/>
            <circle cx="310" cy="419" r="6" fill="#22c55e" stroke="white" stroke-width="2"/>
            <circle cx="530" cy="419" r="6" fill="#22c55e" stroke="white" stroke-width="2"/>
            <circle cx="820" cy="419" r="6" fill="#22c55e" stroke="white" stroke-width="2"/>

            <!-- Red callout at top-right: 10,001 queries -->
            <rect x="680" y="68" width="100" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
            <text x="730" y="84" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#ef4444">10,001 queries</text>

            <!-- Green callout at bottom-right: 2 queries -->
            <rect x="692" y="406" width="80" height="22" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
            <text x="732" y="421" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#22c55e">2 queries</text>

            <!-- "Query overhead" label in the shaded area -->
            <text x="600" y="250" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#ef4444" font-weight="600">Query overhead</text>

            <!-- Legend (top-left of chart area) -->
            <!-- N+1 Pattern legend item -->
            <line x1="120" y1="97" x2="148" y2="97" stroke="#ef4444" stroke-width="3"/>
            <circle cx="134" cy="97" r="5" fill="#ef4444" stroke="white" stroke-width="1.5"/>
            <text x="155" y="101" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#1e293b">N+1 Pattern</text>

            <!-- Batch Loading legend item -->
            <line x1="250" y1="97" x2="278" y2="97" stroke="#22c55e" stroke-width="3"/>
            <circle cx="264" cy="97" r="5" fill="#22c55e" stroke="white" stroke-width="1.5"/>
            <text x="285" y="101" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Batch Loading</text>

        </svg>
    </div>
</body>
</html>
