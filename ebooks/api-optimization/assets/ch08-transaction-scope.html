<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Scope</title>
    <style>
        body {
            font-family: Liberation Sans, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .diagram-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            max-width: 100%;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrow-down-left" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <path d="M0,0 L0,8 L8,4 Z" fill="#64748b"/>
                </marker>
                <marker id="arrow-down-right" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <path d="M0,0 L0,8 L8,4 Z" fill="#64748b"/>
                </marker>
                <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <path d="M0,0 L0,8 L8,4 Z" fill="#ef4444"/>
                </marker>
                <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <path d="M0,0 L0,8 L8,4 Z" fill="#22c55e"/>
                </marker>
            </defs>

            <!-- Overall title -->
            <text x="450" y="35" text-anchor="middle" style="font-size:20px;font-weight:bold;fill:#1e293b;">Transaction Scope: Narrow vs. Wide</text>

            <!-- ==================== LEFT PANEL: Wide Transaction ==================== -->

            <!-- Panel background -->
            <rect x="50" y="60" width="370" height="470" rx="8" style="fill:#fff7f7;stroke:#fecaca;stroke-width:1.5;"/>

            <!-- Panel label -->
            <text x="235" y="85" text-anchor="middle" style="font-size:15px;font-weight:bold;fill:#ef4444;">Wide Transaction</text>

            <!-- Time axis line -->
            <line x1="120" y1="100" x2="120" y2="480" style="stroke:#94a3b8;stroke-width:1.5;"/>
            <!-- Time axis arrowhead -->
            <line x1="120" y1="480" x2="116" y2="470" style="stroke:#94a3b8;stroke-width:1.5;"/>
            <line x1="120" y1="480" x2="124" y2="470" style="stroke:#94a3b8;stroke-width:1.5;"/>
            <!-- Time label -->
            <text x="108" y="295" text-anchor="middle" style="font-size:11px;fill:#64748b;" transform="rotate(-90,108,295)">Time</text>

            <!-- Wide transaction bar (tall red rectangle) -->
            <rect x="140" y="110" width="80" height="340" rx="4" style="fill:#fee2e2;stroke:#ef4444;stroke-width:2;"/>

            <!-- Labels on/beside the transaction bar -->
            <text x="180" y="130" text-anchor="middle" style="font-size:11px;font-weight:bold;fill:#1e293b;">Open</text>
            <text x="180" y="152" text-anchor="middle" style="font-size:10px;fill:#1e293b;">Lock acquired</text>

            <text x="180" y="195" text-anchor="middle" style="font-size:10px;fill:#7f1d1d;">Validation</text>
            <text x="180" y="209" text-anchor="middle" style="font-size:10px;fill:#7f1d1d;">logic...</text>

            <text x="180" y="258" text-anchor="middle" style="font-size:10px;fill:#7f1d1d;">External API</text>
            <text x="180" y="272" text-anchor="middle" style="font-size:10px;fill:#7f1d1d;">call...</text>

            <text x="180" y="325" text-anchor="middle" style="font-size:10px;fill:#7f1d1d;">More</text>
            <text x="180" y="339" text-anchor="middle" style="font-size:10px;fill:#7f1d1d;">computation...</text>

            <text x="180" y="390" text-anchor="middle" style="font-size:10px;fill:#1e293b;">DB write</text>

            <text x="180" y="430" text-anchor="middle" style="font-size:11px;font-weight:bold;fill:#1e293b;">Commit</text>

            <!-- Blocked arrows (3 concurrent requests being blocked) -->
            <!-- Arrow 1 -->
            <line x1="225" y1="195" x2="310" y2="195" style="stroke:#ef4444;stroke-width:1.5;" marker-end="url(#arrow-red)"/>
            <text x="316" y="191" style="font-size:10px;fill:#ef4444;">Blocked ✗</text>
            <text x="316" y="203" style="font-size:10px;fill:#ef4444;">Request #1</text>

            <!-- Arrow 2 -->
            <line x1="225" y1="265" x2="310" y2="265" style="stroke:#ef4444;stroke-width:1.5;" marker-end="url(#arrow-red)"/>
            <text x="316" y="261" style="font-size:10px;fill:#ef4444;">Blocked ✗</text>
            <text x="316" y="273" style="font-size:10px;fill:#ef4444;">Request #2</text>

            <!-- Arrow 3 -->
            <line x1="225" y1="335" x2="310" y2="335" style="stroke:#ef4444;stroke-width:1.5;" marker-end="url(#arrow-red)"/>
            <text x="316" y="331" style="font-size:10px;fill:#ef4444;">Blocked ✗</text>
            <text x="316" y="343" style="font-size:10px;fill:#ef4444;">Request #3</text>

            <!-- Bottom label left panel -->
            <text x="235" y="520" text-anchor="middle" style="font-size:12px;font-weight:bold;fill:#ef4444;">Locks held for entire duration</text>

            <!-- ==================== RIGHT PANEL: Narrow Transaction ==================== -->

            <!-- Panel background -->
            <rect x="480" y="60" width="390" height="470" rx="8" style="fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.5;"/>

            <!-- Panel label -->
            <text x="675" y="85" text-anchor="middle" style="font-size:15px;font-weight:bold;fill:#22c55e;">Narrow Transaction</text>

            <!-- Time axis line -->
            <line x1="550" y1="100" x2="550" y2="480" style="stroke:#94a3b8;stroke-width:1.5;"/>
            <!-- Time axis arrowhead -->
            <line x1="550" y1="480" x2="546" y2="470" style="stroke:#94a3b8;stroke-width:1.5;"/>
            <line x1="550" y1="480" x2="554" y2="470" style="stroke:#94a3b8;stroke-width:1.5;"/>
            <!-- Time label -->
            <text x="538" y="295" text-anchor="middle" style="font-size:11px;fill:#64748b;" transform="rotate(-90,538,295)">Time</text>

            <!-- Gray pre-transaction block -->
            <rect x="570" y="110" width="80" height="220" rx="4" style="fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;"/>

            <!-- Labels beside gray block -->
            <text x="660" y="175" style="font-size:10px;fill:#475569;">Validation</text>
            <text x="660" y="188" style="font-size:10px;fill:#475569;">(outside tx)</text>

            <text x="660" y="220" style="font-size:10px;fill:#475569;">Computation</text>
            <text x="660" y="233" style="font-size:10px;fill:#475569;">(outside tx)</text>

            <text x="660" y="270" style="font-size:10px;fill:#475569;">External API call</text>
            <text x="660" y="283" style="font-size:10px;fill:#475569;">(outside tx)</text>

            <!-- Small green transaction block -->
            <rect x="570" y="340" width="80" height="90" rx="4" style="fill:#dcfce7;stroke:#22c55e;stroke-width:2;"/>

            <!-- Labels beside green block -->
            <text x="610" y="360" text-anchor="middle" style="font-size:11px;font-weight:bold;fill:#1e293b;">Open</text>
            <text x="610" y="382" text-anchor="middle" style="font-size:10px;fill:#1e293b;">DB write</text>
            <text x="610" y="410" text-anchor="middle" style="font-size:11px;font-weight:bold;fill:#1e293b;">Commit</text>

            <!-- Green proceeding arrows (3 concurrent requests) -->
            <!-- Arrow 1 - during pre-transaction phase -->
            <line x1="655" y1="180" x2="740" y2="180" style="stroke:#22c55e;stroke-width:1.5;" marker-end="url(#arrow-green)"/>
            <text x="746" y="176" style="font-size:10px;fill:#22c55e;">✓ Proceeds</text>
            <text x="746" y="188" style="font-size:10px;fill:#22c55e;">normally #1</text>

            <!-- Arrow 2 -->
            <line x1="655" y1="240" x2="740" y2="240" style="stroke:#22c55e;stroke-width:1.5;" marker-end="url(#arrow-green)"/>
            <text x="746" y="236" style="font-size:10px;fill:#22c55e;">✓ Proceeds</text>
            <text x="746" y="248" style="font-size:10px;fill:#22c55e;">normally #2</text>

            <!-- Arrow 3 - during narrow tx phase -->
            <line x1="655" y1="380" x2="740" y2="380" style="stroke:#22c55e;stroke-width:1.5;" marker-end="url(#arrow-green)"/>
            <text x="746" y="376" style="font-size:10px;fill:#22c55e;">✓ Proceeds</text>
            <text x="746" y="388" style="font-size:10px;fill:#22c55e;">normally #3</text>

            <!-- Bottom label right panel -->
            <text x="675" y="520" text-anchor="middle" style="font-size:12px;font-weight:bold;fill:#22c55e;">Minimal lock duration</text>

        </svg>
    </div>
</body>
</html>
