<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Access Patterns</title>
    <style>
        body {
            font-family: Liberation Sans, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .diagram-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            max-width: 100%;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" style="fill: #3b82f6;" />
                </marker>
                <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" style="fill: #22c55e;" />
                </marker>
                <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" style="fill: #ef4444;" />
                </marker>
                <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" style="fill: #f59e0b;" />
                </marker>
                <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" style="fill: #818cf8;" />
                </marker>
            </defs>

            <!-- Title -->
            <text x="450" y="35" text-anchor="middle" style="font-size: 18px; font-weight: 600; fill: #1e293b;" font-family="Liberation Sans, Arial, sans-serif">Database Access Patterns</text>
            <!-- Subtitle -->
            <text x="450" y="55" text-anchor="middle" style="font-size: 12px; fill: #64748b;" font-family="Liberation Sans, Arial, sans-serif">Eight performance mistakes and how to correct them</text>

            <!-- ============================================================
                 Database cylinder centered at (450, 300)
                 Cylinder body: rect from y=275 to y=335 (height=60), x=405..495 (width=90)
                 Top ellipse: cx=450, cy=275, rx=45, ry=14
                 Bottom ellipse: cx=450, cy=335, rx=45, ry=14
            ============================================================ -->

            <!-- Cylinder body -->
            <rect x="405" y="275" width="90" height="60" style="fill: #1e40af; stroke: none;" />
            <!-- Cylinder bottom ellipse (drawn before top so top covers the overlap) -->
            <ellipse cx="450" cy="335" rx="45" ry="14" style="fill: #1d4ed8; stroke: #1e40af; stroke-width: 1;" />
            <!-- Cylinder top ellipse -->
            <ellipse cx="450" cy="275" rx="45" ry="14" style="fill: #3b82f6; stroke: #1e40af; stroke-width: 1;" />
            <!-- Highlight stripe on cylinder body for 3D effect -->
            <rect x="405" y="275" width="18" height="60" style="fill: #2563eb; stroke: none; opacity: 0.5;" />

            <!-- DB label -->
            <text x="450" y="308" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #ffffff;" font-family="Liberation Sans, Arial, sans-serif">DB</text>

            <!-- ============================================================
                 8 topic boxes arranged in a circle at radius ~185 from (450,300)
                 Angles (starting top, going clockwise, evenly spaced at 45°):
                   0: 270° (top)        → Transactions
                   1: 315° (top-right)  → Connection Pools
                   2:   0° (right)      → N+1 Queries
                   3:  45° (bot-right)  → Lock Contention
                   4:  90° (bottom)     → ORM Traps
                   5: 135° (bot-left)   → Bulk Operations
                   6: 180° (left)       → Indexing
                   7: 225° (top-left)   → Pagination

                 Box size: 120 x 40, centered on the computed point.
                 Arrow: from cylinder surface outward to box edge.

                 Computed centers (r=185 from 450,300):
                   0: 270° → (450, 115)
                   1: 315° → (581, 169)
                   2:   0° → (635, 300)
                   3:  45° → (581, 431)
                   4:  90° → (450, 485)
                   5: 135° → (319, 431)
                   6: 180° → (265, 300)
                   7: 225° → (319, 169)
            ============================================================ -->

            <!-- ========================
                 1. Transactions — top (270°)
                 Box center: (450, 115)
                 Arrow: from cylinder top (450, 261) to box bottom (450, 135)
            ======================== -->
            <line x1="450" y1="261" x2="450" y2="137"
                  style="stroke: #3b82f6; stroke-width: 2;"
                  marker-end="url(#arrow-blue)" />
            <rect x="390" y="95" width="120" height="40" rx="6"
                  style="fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5;" />
            <text x="450" y="120" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">Transactions</text>

            <!-- ========================
                 2. Connection Pools — top-right (315°)
                 Box center: (581, 169)
                 Arrow: from cylinder top-right surface approx (482, 265) to box bottom-left approx (521, 189)
            ======================== -->
            <line x1="484" y1="264" x2="521" y2="191"
                  style="stroke: #22c55e; stroke-width: 2;"
                  marker-end="url(#arrow-green)" />
            <rect x="521" y="149" width="120" height="40" rx="6"
                  style="fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5;" />
            <text x="581" y="174" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">Connection Pools</text>

            <!-- ========================
                 3. N+1 Queries — right (0°)
                 Box center: (635, 300)
                 Arrow: from cylinder right (495, 300) to box left (635-60=575, 300)
            ======================== -->
            <line x1="495" y1="300" x2="573" y2="300"
                  style="stroke: #ef4444; stroke-width: 2;"
                  marker-end="url(#arrow-red)" />
            <rect x="575" y="280" width="120" height="40" rx="6"
                  style="fill: #fee2e2; stroke: #ef4444; stroke-width: 1.5;" />
            <text x="635" y="305" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">N+1 Queries</text>

            <!-- ========================
                 4. Lock Contention — bottom-right (45°)
                 Box center: (581, 431)
                 Arrow: from cylinder bottom-right approx (484, 336) to box top-left approx (521, 411)
            ======================== -->
            <line x1="484" y1="336" x2="521" y2="409"
                  style="stroke: #f59e0b; stroke-width: 2;"
                  marker-end="url(#arrow-orange)" />
            <rect x="521" y="411" width="120" height="40" rx="6"
                  style="fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5;" />
            <text x="581" y="436" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">Lock Contention</text>

            <!-- ========================
                 5. ORM Traps — bottom (90°)
                 Box center: (450, 485)
                 Arrow: from cylinder bottom (450, 349) to box top (450, 465)
            ======================== -->
            <line x1="450" y1="349" x2="450" y2="463"
                  style="stroke: #818cf8; stroke-width: 2;"
                  marker-end="url(#arrow-purple)" />
            <rect x="390" y="465" width="120" height="40" rx="6"
                  style="fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5;" />
            <text x="450" y="490" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">ORM Traps</text>

            <!-- ========================
                 6. Bulk Operations — bottom-left (135°)
                 Box center: (319, 431)
                 Arrow: from cylinder bottom-left approx (416, 336) to box top-right approx (379, 411)
            ======================== -->
            <line x1="416" y1="336" x2="379" y2="409"
                  style="stroke: #3b82f6; stroke-width: 2;"
                  marker-end="url(#arrow-blue)" />
            <rect x="259" y="411" width="120" height="40" rx="6"
                  style="fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5;" />
            <text x="319" y="436" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">Bulk Operations</text>

            <!-- ========================
                 7. Indexing — left (180°)
                 Box center: (265, 300)
                 Arrow: from cylinder left (405, 300) to box right (265+60=325, 300)
            ======================== -->
            <line x1="405" y1="300" x2="327" y2="300"
                  style="stroke: #22c55e; stroke-width: 2;"
                  marker-end="url(#arrow-green)" />
            <rect x="205" y="280" width="120" height="40" rx="6"
                  style="fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5;" />
            <text x="265" y="305" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">Indexing</text>

            <!-- ========================
                 8. Pagination — top-left (225°)
                 Box center: (319, 169)
                 Arrow: from cylinder top-left approx (416, 265) to box bottom-right approx (379, 191)
            ======================== -->
            <line x1="416" y1="264" x2="379" y2="191"
                  style="stroke: #ef4444; stroke-width: 2;"
                  marker-end="url(#arrow-red)" />
            <rect x="259" y="149" width="120" height="40" rx="6"
                  style="fill: #fee2e2; stroke: #ef4444; stroke-width: 1.5;" />
            <text x="319" y="174" text-anchor="middle"
                  style="font-size: 12px; font-weight: 600; fill: #1e293b;"
                  font-family="Liberation Sans, Arial, sans-serif">Pagination</text>

        </svg>
    </div>
</body>
</html>
